<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <script src="logic.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="containerCalculator">
        <p id="logCalculator">This is some text</p>
        <div id="containerButtons">
            <button class="button operator del"> DEL </button>
            <button class="button operator" data-op="div"> / </button>
            <button class="button operator" data-op="mul"> * </button>
            <button class="button operator" data-op="sub"> - </button>

            <button class="button number" data-num="7"> 7 </button>
            <button class="button number" data-num="8"> 8 </button>
            <button class="button number" data-num="9"> 9 </button>
            <button class="button bigVertical operator" data-op="add"> + </button>

            <button class="button number" data-num="4"> 4 </button>
            <button class="button number" data-num="5"> 5 </button>
            <button class="button number" data-num="6"> 6 </button>

            <button class="button number" data-num="1"> 1 </button>
            <button class="button number" data-num="2"> 2 </button>
            <button class="button number" data-num="3"> 3 </button>
            <button class="button bigVertical operator enter"> ENTER </button>

            <button class="button bigHorizontal number" data-num="0"> 0 </button>
            <button class="button number dot"> . </button>

        </div>
    </div>
</body>
</html>
